<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="qrGlow" x1="254" y1="158" x2="366" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>

  <!-- Canvas background -->
