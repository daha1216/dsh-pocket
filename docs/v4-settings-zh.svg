  <rect x="240" y="406" width="594" height="62" rx="20" fill="#1A202C" stroke="#334155" stroke-opacity="0.75" stroke-width="0.75"/>
  <text x="256" y="431" class="t" fill="#F8FAFC" font-size="13.5" font-weight="500">手机端显示偏好</text>
  <text x="256" y="451" class="t" fill="#94A3B8" font-size="11.5">聊天字号 · 15px &nbsp;&nbsp;|&nbsp;&nbsp; 代码文件底部预览抽屉 · 已开启 &nbsp;&nbsp;|&nbsp;&nbsp; 右边栏 · 已开启</text>

  <!-- Switch ON indicator -->
