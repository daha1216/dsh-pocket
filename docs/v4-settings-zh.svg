  <rect x="327" y="165" width="8" height="8" rx="1" fill="#0F172A"/>
  <rect x="266" y="212" width="22" height="22" rx="3" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="273" y="219" width="8" height="8" rx="1" fill="#0F172A"/>
  <!-- QR modules -->
  <rect x="295" y="160" width="8" height="8" fill="#2563EB"/>
  <rect x="307" y="160" width="7" height="14" fill="#0F172A"/>
  <rect x="295" y="174" width="8" height="14" fill="#0F172A"/>
  <rect x="266" y="188" width="12" height="8" fill="#0F172A"/>
  <rect x="284" y="188" width="18" height="8" fill="#2563EB"/>
