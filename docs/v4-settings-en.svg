<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="qrGlow" x1="254" y1="158" x2="366" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Canvas background -->
  <rect width="880" height="500" rx="20" fill="url(#bg)"/>

  <!-- DSH Settings Modal R28 container -->
  <rect x="24" y="20" width="832" height="460" rx="28" fill="#141821" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>
  <line x1="216" y1="20" x2="216" y2="480" stroke="#262D3D" stroke-width="1"/>

  <!-- Left Sidebar -->
  <text x="44" y="54" class="t" fill="#94A3B8" font-size="12" font-weight="500">Settings</text>

  <g fill="#94A3B8" font-size="13" font-weight="400" class="t">
    <rect x="36" y="72" width="164" height="34" rx="10" fill="transparent"/>
    <circle cx="52" cy="89" r="5" stroke="#64748B" stroke-width="1.5"/>
    <text x="66" y="94">General</text>

    <!-- Active item: Phone access -->
    <rect x="36" y="112" width="164" height="36" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1"/>
    <rect x="47" y="122" width="10" height="16" rx="2.5" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="50" y1="135" x2="54" y2="135" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <text x="66" y="135" fill="#F8FAFC" font-weight="500">Phone access</text>

    <rect x="36" y="156" width="164" height="34" rx="10" fill="transparent"/>
    <rect x="47" y="167" width="11" height="11" rx="2.5" stroke="#64748B" stroke-width="1.5"/>
    <text x="66" y="178">Models</text>

    <rect x="36" y="196" width="164" height="34" rx="10" fill="transparent"/>
    <path d="M48 213H57M52.5 208.5V217.5" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="66" y="218">Plugins</text>
  </g>

  <!-- Right Pane: Header -->
  <text x="240" y="54" class="t" fill="#F8FAFC" font-size="17" font-weight="500">Phone access</text>
  <text x="240" y="72" class="t" fill="#94A3B8" font-size="11.5" font-weight="400">One-step QR pairing · Persistent login across restarts · Fixed-domain tunnel</text>

  <!-- Status Chips -->
  <rect x="612" y="40" width="98" height="24" rx="12" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-opacity="0.45" stroke-width="0.75"/>
  <circle cx="625" cy="52" r="3.5" fill="#10B981"/>
  <text x="635" y="56" class="t" fill="#A7F3D0" font-size="11" font-weight="500">LAN · On</text>

  <rect x="718" y="40" width="116" height="24" rx="12" fill="#1E3A8A" fill-opacity="0.5" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="0.75"/>
  <circle cx="731" cy="52" r="3.5" fill="#38BDF8"/>
  <text x="741" y="56" class="t" fill="#BAE6FD" font-size="11" font-weight="500">Public · Ready</text>

  <!-- Card 1: Connection Hub Card (R20 + 0.5px stroke) -->
  <rect x="240" y="88" width="594" height="172" rx="20" fill="#1A202C" stroke="#334155" stroke-opacity="0.75" stroke-width="0.75"/>

  <!-- Segmented Control -->
  <rect x="256" y="102" width="246" height="34" rx="12" fill="#0F172A" stroke="#334155" stroke-opacity="0.6" stroke-width="0.75"/>
  <rect x="260" y="106" width="114" height="26" rx="8" fill="#1E293B" stroke="#475569" stroke-opacity="0.5" stroke-width="0.75"/>
  <text x="275" y="123" class="t" fill="#F8FAFC" font-size="12" font-weight="500">📶 LAN access</text>
  <text x="386" y="123" class="t" fill="#94A3B8" font-size="12" font-weight="400">🌐 Public domain</text>

  <!-- One-step Pairing Pill -->
  <rect x="676" y="106" width="142" height="26" rx="13" fill="#1E3A8A" fill-opacity="0.45" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="0.75"/>
  <text x="687" y="123" class="t" fill="#93C5FD" font-size="11" font-weight="500">✨ One-step QR pair</text>

  <!-- QR Box -->
  <rect x="256" y="148" width="96" height="96" rx="14" fill="#FFFFFF" stroke="url(#qrGlow)" stroke-width="2"/>
  <rect x="266" y="158" width="22" height="22" rx="3" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="273" y="165" width="8" height="8" rx="1" fill="#0F172A"/>
  <rect x="320" y="158" width="22" height="22" rx="3" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="327" y="165" width="8" height="8" rx="1" fill="#0F172A"/>
  <rect x="266" y="212" width="22" height="22" rx="3" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="273" y="219" width="8" height="8" rx="1" fill="#0F172A"/>
  <!-- QR modules -->
  <rect x="295" y="160" width="8" height="8" fill="#2563EB"/>
  <rect x="307" y="160" width="7" height="14" fill="#0F172A"/>
  <rect x="295" y="174" width="8" height="14" fill="#0F172A"/>
  <rect x="266" y="188" width="12" height="8" fill="#0F172A"/>
  <rect x="284" y="188" width="18" height="8" fill="#2563EB"/>
  <rect x="308" y="188" width="12" height="14" fill="#0F172A"/>
  <rect x="326" y="188" width="16" height="8" fill="#0F172A"/>
  <rect x="294" y="204" width="10" height="12" fill="#0F172A"/>
  <rect x="310" y="208" width="18" height="8" fill="#2563EB"/>
  <rect x="294" y="224" width="18" height="10" fill="#0F172A"/>
  <rect x="320" y="224" width="22" height="10" fill="#0F172A"/>

  <!-- Right side of QR -->
  <text x="368" y="166" class="t" fill="#F8FAFC" font-size="14" font-weight="500">http://192.168.31.18:3081</text>
  <text x="368" y="186" class="t" fill="#94A3B8" font-size="12" font-weight="400">Scan on same Wi-Fi to pair immediately — no PIN required</text>
  <rect x="368" y="196" width="234" height="22" rx="11" fill="#0F172A" stroke="#334155" stroke-width="0.75"/>
  <circle cx="381" cy="207" r="3" fill="#38BDF8"/>
  <text x="390" y="211" class="t" fill="#CBD5E1" font-size="11">Single-use ticket · auto-renews in 82s</text>

  <rect x="368" y="226" width="102" height="24" rx="8" fill="#2563EB"/>
  <text x="380" y="242" class="t" fill="#FFFFFF" font-size="11.5" font-weight="500">Refresh ticket</text>
  <rect x="478" y="226" width="84" height="24" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.75"/>
  <text x="495" y="242" class="t" fill="#E2E8F0" font-size="11.5" font-weight="500">Copy URL</text>

  <!-- Card 2: Authorized Devices Card -->
  <rect x="240" y="272" width="594" height="122" rx="20" fill="#1A202C" stroke="#334155" stroke-opacity="0.75" stroke-width="0.75"/>
  <text x="256" y="297" class="t" fill="#F8FAFC" font-size="13.5" font-weight="500">Authorized devices (2)</text>
  <rect x="742" y="280" width="76" height="24" rx="8" fill="#7F1D1D" fill-opacity="0.35" stroke="#EF4444" stroke-opacity="0.4" stroke-width="0.75"/>
  <text x="752" y="296" class="t" fill="#FCA5A5" font-size="11" font-weight="500">Revoke all</text>

  <!-- Device 1 -->
  <rect x="256" y="310" width="562" height="36" rx="12" fill="#0F172A" fill-opacity="0.7" stroke="#262D3D" stroke-width="0.75"/>
  <circle cx="274" cy="328" r="4" fill="#10B981"/>
  <text x="288" y="332" class="t" fill="#F8FAFC" font-size="12.5" font-weight="500">iPhone · Safari (iOS 18)</text>
  <rect x="454" y="318" width="102" height="20" rx="10" fill="#064E3B" fill-opacity="0.5"/>
  <text x="464" y="332" class="t" fill="#6EE7B7" font-size="10.5">LAN · Online now</text>
  <rect x="688" y="316" width="56" height="24" rx="8" fill="#1E293B"/>
  <text x="696" y="332" class="t" fill="#CBD5E1" font-size="11">Rename</text>
  <rect x="750" y="316" width="56" height="24" rx="8" fill="#7F1D1D" fill-opacity="0.4"/>
  <text x="759" y="332" class="t" fill="#FCA5A5" font-size="11">Revoke</text>

  <!-- Device 2 -->
  <rect x="256" y="352" width="562" height="34" rx="12" fill="#0F172A" fill-opacity="0.45" stroke="#262D3D" stroke-width="0.75"/>
  <circle cx="274" cy="369" r="3.5" fill="#64748B"/>
  <text x="288" y="373" class="t" fill="#E2E8F0" font-size="12.5" font-weight="400">iPad · Safari</text>
  <rect x="454" y="359" width="114" height="20" rx="10" fill="#1E3A8A" fill-opacity="0.4"/>
  <text x="464" y="373" class="t" fill="#93C5FD" font-size="10.5">Public · 12m ago</text>
  <rect x="688" y="357" width="56" height="24" rx="8" fill="#1E293B"/>
  <text x="696" y="373" class="t" fill="#CBD5E1" font-size="11">Rename</text>
  <rect x="750" y="357" width="56" height="24" rx="8" fill="#7F1D1D" fill-opacity="0.4"/>
  <text x="759" y="373" class="t" fill="#FCA5A5" font-size="11">Revoke</text>

  <!-- Card 3: Mobile Prefs Peek -->
  <rect x="240" y="406" width="594" height="62" rx="20" fill="#1A202C" stroke="#334155" stroke-opacity="0.75" stroke-width="0.75"/>
  <text x="256" y="431" class="t" fill="#F8FAFC" font-size="13.5" font-weight="500">Mobile preferences</text>
  <text x="256" y="451" class="t" fill="#94A3B8" font-size="11.5">Font size · 15px &nbsp;&nbsp;|&nbsp;&nbsp; Tap file path to preview sheet · On &nbsp;&nbsp;|&nbsp;&nbsp; Right sidebar · On</text>

  <!-- Switch ON indicator -->
  <rect x="780" y="426" width="38" height="22" rx="11" fill="#2563EB"/>
  <circle cx="807" cy="437" r="8" fill="#FFFFFF"/>
</svg>
