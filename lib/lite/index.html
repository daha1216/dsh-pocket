<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH Pocket">
<meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<title>DSH Pocket</title>
<link rel="stylesheet" href="/__dsh-pocket/lite/app.css">
<link rel="manifest" href="/__dsh-pocket/lite/manifest.webmanifest">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="back" hidden>&#8249;</button>
    <div class="topbar__title" id="title">DSH Pocket</div>
    <button class="icon-btn" id="refreshBtn" type="button" aria-label="refresh">&#8635;</button>
  </header>

  <div class="banner" id="banner" hidden>
    <span class="banner__text" id="bannerText"></span>
    <a class="banner__link" id="bannerLink" href="/" hidden>打开主界面</a>
    <button class="banner__retry" id="bannerRetry" type="button" hidden>重试</button>
  </div>

  <main class="view view--list" id="viewList">
    <div class="hint" id="listHint" hidden></div>
    <ul class="list" id="sessionList"></ul>
    <div class="empty" id="listEmpty" hidden></div>
  </main>

  <main class="view view--chat" id="viewChat" hidden>
    <div class="messages" id="messages"></div>
    <button class="older" id="olderBtn" type="button" hidden>加载更早的消息</button>
  </main>

  <form class="composer" id="composer" hidden>
    <textarea class="composer__input" id="input" rows="1" placeholder="发消息…" autocapitalize="sentences" autocomplete="off"></textarea>
    <button class="btn btn--send" id="sendBtn" type="submit">发送</button>
    <button class="btn btn--stop" id="stopBtn" type="button" hidden>停止</button>
  </form>
</div>

<div class="approvals" id="approvals"></div>
<div class="toast" id="toast" hidden></div>

<script src="/__dsh-pocket/lite/app.js" defer></script>
</body>
</html>
