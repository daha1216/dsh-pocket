name: Test

# push/PR 时只跑全量门禁与测试，不发版（发版走手动的 Release workflow）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # 双分块构建产物 client/client.js + client/client.mobile.js 及锚点台账随包发布；
      # CI 重建后必须零 diff，并过锚点契约检查与双分块激活门禁。
      - run: npm run build
      - run: git diff --exit-code -- client/client.js client/client.mobile.js client/mobile/anchors.ts
      - run: node scripts/gen-anchors.mjs --check
      - run: node client/repro-activate.mjs
      - run: npm test
